<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anonymous letters from strangers, for strangers. Write what you’re carrying, or what went right. No names, no accounts." />
    <meta name="theme-color" content="#faf8f5" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var t = localStorage.getItem("someone-today:theme");
          if (t !== "dark" && t !== "auto") t = "light";
          document.documentElement.dataset.theme = t;
          var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#181513");
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <title>Someone Today: anonymous letters</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (link previews on iMessage, Instagram, etc) -->
    <meta property="og:title" content="Someone Today" />
    <meta property="og:description" content="Anonymous letters from strangers, for strangers. Write what you’re carrying, or what went right. No names, no accounts." />
    <meta property="og:image" content="https://getsomeonetoday.com/og-image.png" />

    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="Someone Today" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
    <!-- Google Analytics -->
